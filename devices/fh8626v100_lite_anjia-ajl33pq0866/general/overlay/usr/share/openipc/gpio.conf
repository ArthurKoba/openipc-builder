# Unknown or unvalidated owners stay disabled instead of guessing from a
# related Fullhan board.
alarm_in=-1
alarm_out=-1
# Exact PQEWN-01 stock configuration names GPIO61 as the reset key
# (keypress_func=61,1,reset). Target testing confirms release=1, press=0, so
# the physical button is active-low. Board init must first mux pad66 from the
# unused SD0_DATA_1 function to GPIO61; SD0 remains in proven 1-bit mode.
button=61
ircut1=-1
ircut2=-1
led1=-1
led2=-1
# Stock U-Boot and physical test: GPIO25 is active-high IR illumination.
light_ir=25
# Stock and physical test: GPIO23 is active-high white illumination. GPIO23
# shares pad70 with SADC channel 1, so board runtime must select GPIO23 before
# use, force it low at shutdown, then restore SADC_CHANL1.
light_wl=23
# Hardware test identifies FH SADC channel 1 as light-sensitive. It shares
# pad70 with white-light GPIO23 and cannot be sampled while GPIO23 is selected.
# (about 402 mV lit, 240 mV covered; darker -> lower). Keep this generic GPIO
# field disabled: stock ldr_region uses an ISP/AE metric, and no calibrated
# OpenIPC SADC day/night consumer exists yet.
light_sensor=-1
mmc_pwr=-1
pir_sensor=-1
relay=-1
speaker=-1
usb=-1
